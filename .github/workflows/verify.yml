name: Verify Peer-Agent Contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile validators and runtimes
        run: >-
          python -m py_compile
          scripts/validate_finding.py
          scripts/check_contract.py
          scripts/check_research_contract.py
          scripts/validate_rnd_task.py
          scripts/check_rnd_contract.py
          scripts/validate_calibration_task.py
          scripts/validate_decision_trace.py
          scripts/check_architecture_historical_cases.py
          scripts/check_calibration_loop.py
          scripts/check_live_adapters.py
          scripts/run_architecture_clean_ab.py
          runtime/calibration_loop/routing.py
          runtime/calibration_loop/adapters.py
          runtime/calibration_loop/openai_resource_adapter.py
          runtime/calibration_loop/openai_rnd_adapter.py
          runtime/calibration_loop/run.py

      - name: Validate canonical Neta finding
        run: python scripts/validate_finding.py fixtures/valid-finding.json

      - name: Run Neta agent contract and positive controls
        run: python scripts/check_contract.py

      - name: Run research quarantine contract and positive controls
        run: python scripts/check_research_contract.py

      - name: Validate canonical R&D task
        run: python scripts/validate_rnd_task.py fixtures/rnd-valid-task.json

      - name: Run R&D runtime contract and positive controls
        run: python scripts/check_rnd_contract.py

      - name: Validate calibration-loop task
        run: python scripts/validate_calibration_task.py fixtures/calibration-valid-task.json

      - name: Validate decision-execution-learning fixture
        run: python scripts/validate_decision_trace.py fixtures/decision-execution-learning-valid.json

      - name: Validate real Architecture corpus execution trace
        run: python scripts/validate_decision_trace.py runtime/execution_traces/DEL-ARCH-CORPUS-001.json

      - name: Check Architecture historical benchmark corpus
        run: python scripts/check_architecture_historical_cases.py

      - name: Run calibration-loop routing and trace controls
        run: python scripts/check_calibration_loop.py

      - name: Run live-adapter offline controls
        run: python scripts/check_live_adapters.py

      - name: Run calibration-loop mock end to end
        run: python runtime/calibration_loop/run.py fixtures/calibration-valid-task.json --mock --strict

  architecture-clean-ab:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/architecture-clean-ab-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH_BENCH_ENGINE: copilot
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout isolated benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest Copilot CLI
        run: npm install -g @github/copilot

      - name: Select and freeze explicit models
        shell: bash
        run: |
          set -u
          models=(gpt-5.4 claude-sonnet-4.6 gpt-5-mini claude-haiku-4.5 gemini-3.5-flash)
          available=()
          for model in "${models[@]}"; do
            set +e
            output=$(copilot -s -p 'Return exactly {"probe":true} and nothing else.' --no-custom-instructions --no-ask-user --model "$model" 2>/tmp/copilot-model-probe.err)
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              available+=("$model")
              echo "MODEL_AVAILABLE $model"
            else
              echo "MODEL_UNAVAILABLE $model"
            fi
          done
          if [ "${#available[@]}" -eq 0 ]; then
            echo "No explicit Copilot model is available; auto is inadmissible for the frozen same-model protocol." >&2
            exit 1
          fi
          runner="${available[0]}"
          if [ "${#available[@]}" -ge 2 ]; then judge="${available[1]}"; else judge="$runner"; fi
          echo "ARCH_COPILOT_MODEL=$runner" >> "$GITHUB_ENV"
          echo "ARCH_BENCH_JUDGE_MODEL=$judge" >> "$GITHUB_ENV"
          mkdir -p runtime/architecture_ab
          RUNNER_MODEL="$runner" JUDGE_MODEL="$judge" AVAILABLE_MODELS="$(IFS=,; echo "${available[*]}")" python - <<'PY'
          import json, os, pathlib
          path=pathlib.Path('runtime/architecture_ab/MODEL_SELECTION.json')
          path.write_text(json.dumps({
              'status':'FROZEN_BEFORE_CASES',
              'selection_rule_version':'CLEAN_AB_EXECUTION_PROTOCOL_V0_2',
              'ordered_probe_list':['gpt-5.4','claude-sonnet-4.6','gpt-5-mini','claude-haiku-4.5','gemini-3.5-flash'],
              'available_explicit_models':os.environ['AVAILABLE_MODELS'].split(','),
              'runner_model':os.environ['RUNNER_MODEL'],
              'judge_model':os.environ['JUDGE_MODEL']
          },indent=2,sort_keys=True)+'\n')
          PY
          cat runtime/architecture_ab/MODEL_SELECTION.json

      - name: Compile and validate frozen inputs
        run: |
          python -m py_compile scripts/run_architecture_clean_ab.py runtime/calibration_loop/openai_resource_adapter.py
          python scripts/run_architecture_clean_ab.py --validate-only

      - name: Run clean staged A/B
        id: benchmark
        shell: bash
        run: |
          set +e
          python scripts/run_architecture_clean_ab.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload benchmark trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-clean-ab
          path: runtime/architecture_ab/
          if-no-files-found: warn
          retention-days: 30

      - name: Require benchmark completion
        if: always()
        shell: bash
        run: |
          test "${{ steps.benchmark.outputs.exit_code }}" = "0"
