name: Lichess Framework Fit Experiment

on:
  push:
    branches:
      - run/lichess-move-rnd-recursive-2026-09-13
    paths:
      - '.github/workflows/framework-fit.yml'
      - 'research/deep-research-preflight/framework_fit_experiment.py'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v4

      - name: Checkout lichess evidence repository
        uses: actions/checkout@v4
        with:
          repository: ereztash/lichess_app
          path: external/lichess_app

      - name: Install analysis dependencies
        run: python -m pip install --quiet pandas pyarrow zstandard python-chess scikit-learn pysubgroup

      - name: Run framework fit experiment
        run: |
          python research/deep-research-preflight/framework_fit_experiment.py
          test -s runtime/framework_fit_results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-fit-${{ github.sha }}
          path: runtime/framework_fit_results.json
          if-no-files-found: warn
