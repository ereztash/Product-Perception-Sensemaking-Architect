name: Live Lichess Commercial Roadmap Calibration

on:
  push:
    branches:
      - run/lichess-whitepaper-calibration-2026-09-06
    paths:
      - "fixtures/calibration-lichess-commercial-roadmap-2026-09-06.json"
      - ".github/workflows/run-lichess-commercial-roadmap-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate calibration task
        run: python scripts/validate_calibration_task.py fixtures/calibration-lichess-commercial-roadmap-2026-09-06.json

      - name: Execute live calibration loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          OPENAI_REASONING_EFFORT: high
          CALIBRATION_RND_REASONING_EFFORT: high
          CALIBRATION_NETA_REASONING_EFFORT: high
          CALIBRATION_RND_WEB_SEARCH: '0'
        run: |
          python runtime/calibration_loop/run.py \
            fixtures/calibration-lichess-commercial-roadmap-2026-09-06.json \
            --config runtime/calibration_loop/openai-config.example.json \
            --strict \
            --output runtime/calibration_loop/traces/CAL-LICHESS-COMMERCIAL-ROADMAP-001.json

      - name: Print trace
        if: always()
        run: |
          if [ -f runtime/calibration_loop/traces/CAL-LICHESS-COMMERCIAL-ROADMAP-001.json ]; then
            cat runtime/calibration_loop/traces/CAL-LICHESS-COMMERCIAL-ROADMAP-001.json
          else
            echo 'trace not produced'
          fi

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAL-LICHESS-COMMERCIAL-ROADMAP-001
          path: runtime/calibration_loop/traces/CAL-LICHESS-COMMERCIAL-ROADMAP-001.json
          if-no-files-found: warn
