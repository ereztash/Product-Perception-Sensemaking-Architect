name: OSS R&D Decision Delta Pilot

on:
  push:
    branches:
      - run/delta-v02-batch-2026-09-08
    paths:
      - '.github/workflows/delta-v02-batch.yml'

permissions:
  contents: read
  copilot-requests: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: checkstyle-20818
            task: research/deep-research-preflight/OSS-CHECKSTYLE-20818.task.json
          - id: paperclip-4328
            task: research/deep-research-preflight/OSS-PAPERCLIP-4328.task.json
          - id: pulsar-24628
            task: research/deep-research-preflight/OSS-PULSAR-24628.task.json
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CASE_ID: ${{ matrix.id }}
      TASK_PATH: ${{ matrix.task }}
      CANONICAL_RUNTIME_BASE: 74fc4af509965497a7440d9521fc3717b2809f50
    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@v4

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Validate task
        run: python scripts/validate_calibration_task.py "$TASK_PATH"

      - name: Freeze strong direct baseline
        shell: bash
        run: |
          mkdir -p oss-pilot
          python - <<'PY'
          import json, os
          task=json.load(open(os.environ['TASK_PATH'],encoding='utf-8'))
          prompt=f'''You are a strong senior engineering decision adviser. Do NOT use or imitate any R&D Agent framework. Based only on the case below, give the best direct next decision and action you would recommend now. Do not browse, do not infer the eventual historical resolution, and do not add generic caveats. State: (1) decision, (2) next action, (3) what would reverse it.\n\nCASE:\n{json.dumps(task,ensure_ascii=False,indent=2)}'''
          open(f"oss-pilot/{os.environ['CASE_ID']}.baseline.prompt.txt","w",encoding='utf-8').write(prompt)
          PY
          copilot -p "$(cat oss-pilot/${CASE_ID}.baseline.prompt.txt)" -s --no-ask-user --no-custom-instructions > "oss-pilot/${CASE_ID}.baseline.txt"
          echo "--- BASELINE ${CASE_ID} ---"
          cat "oss-pilot/${CASE_ID}.baseline.txt"

      - name: Run canonical Calibration Loop v0.2
        shell: bash
        run: |
          set +e
          OUT="oss-pilot/${CASE_ID}.rnd.trace.json"
          python runtime/calibration_loop/run.py \
            "$TASK_PATH" \
            --config runtime/calibration_loop/copilot-config-v02.best-effort.json \
            --strict \
            --output "$OUT"
          RC=$?
          echo "--- R&D TRACE ${CASE_ID} ---"
          cat "$OUT" || true
          exit $RC

      - name: Create compact comparison record
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          cid=os.environ['CASE_ID']
          rec={'case_id':cid,'runtime_version':'0.2','provider':'github-copilot-cli','exact_model_lineage':'unknown','independence_limit':'Baseline and R&D use the same provider-selected model lineage; this is directional decision-delta evidence, not independent confirmation.'}
          try: rec['baseline']=open(f'oss-pilot/{cid}.baseline.txt',encoding='utf-8').read()
          except: rec['baseline']=None
          try:
            tr=json.load(open(f'oss-pilot/{cid}.rnd.trace.json',encoding='utf-8'))
            syn=tr.get('synthesis') or {}
            rec['final_state']=tr.get('final_state')
            rec['routed_resources']=(tr.get('routing') or {}).get('resources')
            rec['decision_before']=syn.get('decision_before')
            rec['decision_after']=syn.get('decision_after')
            rec['next_move']=syn.get('next_move')
            rec['resource_deltas']=syn.get('resource_deltas')
            rec['failure']=tr.get('failure')
          except Exception as e: rec['trace_error']=str(e)
          with open(f'oss-pilot/{cid}.comparison.json','w',encoding='utf-8') as f: json.dump(rec,f,ensure_ascii=False,indent=2)
          print(json.dumps(rec,ensure_ascii=False,indent=2))
          PY

      - name: Upload pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-rnd-pilot-${{ matrix.id }}-${{ github.sha }}
          path: oss-pilot/${{ matrix.id }}.*
          if-no-files-found: warn
