name: R&D Deep Research Preflight

on:
  push:
    branches: [main]
    paths:
      - 'research/deep-research-preflight/*.task.json'

permissions:
  contents: read
  models: read

jobs:
  run-rnd:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY || secrets.OPENAI_KEY || vars.OPENAI_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      OPENAI_REASONING_EFFORT: high
      OLLAMA_MODEL: qwen2.5:1.5b-instruct
      OLLAMA_NUM_CTX: '16384'
      OLLAMA_NUM_PREDICT: '3600'
      OLLAMA_TIMEOUT_SECONDS: '900'
      CALIBRATION_RND_WEB_SEARCH: '0'
      CALIBRATION_NETA_WEB_SEARCH: '0'
      CALIBRATION_SCAFFOLD_WEB_SEARCH: '0'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve changed calibration task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          TASK="$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^research/deep-research-preflight/.*\.task\.json$' | tail -n 1)"
          test -n "$TASK"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Resolved task: $TASK"

      - name: Select live adapter provider
        id: provider
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "config=runtime/calibration_loop/openai-config.example.json" >> "$GITHUB_OUTPUT"
            echo "provider=openai" >> "$GITHUB_OUTPUT"
            echo "Using OpenAI Responses adapter"
          else
            echo "config=runtime/calibration_loop/ollama-config.example.json" >> "$GITHUB_OUTPUT"
            echo "provider=ollama-local" >> "$GITHUB_OUTPUT"
            echo "Using local Ollama adapter; no external credential required"
          fi

      - name: Start local Ollama provider
        if: steps.provider.outputs.provider == 'ollama-local'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "${OLLAMA_MODEL}"
          ollama list

      - name: Validate task contract
        shell: bash
        run: python scripts/validate_calibration_task.py "${{ steps.task.outputs.task }}"

      - name: Run canonical live Calibration Loop
        id: run
        shell: bash
        run: |
          set -euo pipefail
          OUT="runtime/execution_traces/DR-${GITHUB_SHA}.json"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "Provider: ${{ steps.provider.outputs.provider }}"
          python runtime/calibration_loop/run.py \
            "${{ steps.task.outputs.task }}" \
            --config "${{ steps.provider.outputs.config }}" \
            --strict \
            --output "$OUT"

      - name: Print Ollama log on failure
        if: failure() && steps.provider.outputs.provider == 'ollama-local'
        shell: bash
        run: |
          if [ -f /tmp/ollama.log ]; then
            tail -n 200 /tmp/ollama.log
          fi

      - name: Print execution trace
        if: always()
        shell: bash
        run: |
          OUT="runtime/execution_traces/DR-${GITHUB_SHA}.json"
          if [ -f "$OUT" ]; then
            cat "$OUT"
          fi

      - name: Upload execution trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnd-trace-${{ github.sha }}
          path: runtime/execution_traces/DR-${GITHUB_SHA}.json
          if-no-files-found: warn
